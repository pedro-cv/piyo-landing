name: Error en la página
description: Algo se ve mal o no funciona.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Qué hiciste, qué esperabas, qué viste.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 130, Android 14 / Firefox, Windows 11
