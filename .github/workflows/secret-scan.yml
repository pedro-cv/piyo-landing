name: secrets
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly full-history scan
permissions:
  contents: read
jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (tree + history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: "true"
      - name: Project pattern scan
        run: bash scripts/check-secrets.sh
      - name: Forbidden files never tracked
        run: |
          bad=$(git ls-files | grep -Ei '(^|/)\.env($|\.)|keys\.properties$|\.(jks|keystore|p12|pem|pfx)$' | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::sensitive files tracked: $bad"; exit 1; fi
