name: landing
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: landing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Landing build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
      - name: vercel.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
